# Copied to scale-atlas-media/.github/workflows/publish.yml by syncQueue() in scripts/post.mjs. Edit it here.
# GitHub delays or drops scheduled runs (2026-10-21: neither 19:00 nor 19:47 KST started), so runs are scheduled hourly
# from 13:23 KST: the first one that starts waits in ci-publish.mjs until 19:00 and posts (one post a day), later ones
# queue behind it and find nothing to do. 19:17 and later are retries; the Mac bot also dispatches at 19:20 when on.
# None of those schedules ever fired on this repo, so a Claude cloud routine pushes tick.txt at 18:50 and 19:50 KST
# (user, 2026-10-21): that push starts this run, which waits until 19:00 like an early scheduled one.
name: publish
on:
  push:
    branches: [main]
    paths: [tick.txt]
  schedule:
    - cron: '23 4-9 * * *'
    - cron: '43 9 * * *'
    - cron: '17 10 * * *'
    - cron: '47 10 * * *'
    - cron: '17 12 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: only check tokens and hosted files
        type: boolean
        default: true
      force:
        description: post now even before POST_TIME
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: node ci-publish.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY: ${{ inputs.dry && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
      - if: always() && !inputs.dry
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm 'Publish run'
          git push || (git pull -q --rebase && git push)
